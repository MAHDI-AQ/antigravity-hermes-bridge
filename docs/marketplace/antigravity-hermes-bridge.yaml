# Ready-to-submit Hermes Marketplace catalog entry for NousResearch/hermes-agent:
#   Run `python scripts/prepare_hermes_catalog.py --sha <40-hex> --maintainer <your-github-handle> --out plugin-catalog/antigravity-hermes-bridge.yaml`
#   inside your workflow before opening the PR to `NousResearch/hermes-agent`.
name: antigravity-hermes-bridge
title: Antigravity <-> Hermes Bridge
repo: https://github.com/MAHDI-AQ/antigravity-hermes-bridge
sha: "d6bbf33e74313c081bb19ca93dd8e3ad5a135115"
subdir: packages/hermes-bridge
description: >-
  Antigravity <-> Hermes interoperability bridge for heterogeneous and local-model
  agent teams. Registers first-class swarm_post, swarm_read, swarm_claim,
  swarm_release, swarm_status, swarm_wait, and swarm_channel tools (plus
  compaction-safe worker hooks gated on HERMES_SWARM_ID) to collaborate with an
  Antigravity IDE session. Pairs with Antigravity IDE and the companion
  Antigravity plugin + local MCP bridge in the same repository.
  Disclosure: communicates strictly over loopback (127.0.0.1) with HERMES_SWARM_HTTP_URL
  using an ephemeral per-swarm Bearer token (no .env, auth.json, or external
  credential store reads), falls back atomically to board files in
  HERMES_SWARM_BOARD_DIR, uses pure Python stdlib with zero pip dependencies,
  zero binaries, zero self-updater, and zero off-machine telemetry.
maintainer: Hermes-Swarm-Contributors
tier: community
category: tools
requires_hermes: ">=0.21.4"
version: "1.0.0"
docs_url: https://github.com/MAHDI-AQ/antigravity-hermes-bridge/blob/d6bbf33e74313c081bb19ca93dd8e3ad5a135115/packages/hermes-bridge/README.md
readme: true
platforms: []
capabilities:
  provides_tools:
    - swarm_post
    - swarm_read
    - swarm_claim
    - swarm_release
    - swarm_status
    - swarm_wait
    - swarm_channel
  provides_hooks: []
  provides_middleware: []
  requires_env: []
